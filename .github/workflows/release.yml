name: Release

# Builds the standalone Windows app and attaches it to a GitHub Release.
# Triggered when you push a version tag, e.g.:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# The result is a zip on the Releases page that users can download and run —
# no Python required. The binary is NOT code-signed, so Windows SmartScreen may
# warn on first run; see the README's "Is the download safe?" section.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v1.0.0 (must not already exist)"
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve release tag
        # A manual (workflow_dispatch) run has no tag ref -- github.ref_name is
        # the branch name ("main"), which action-gh-release below can't release
        # against. Use the input tag for a manual run, the pushed tag otherwise.
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before building
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: python build.py

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path dist/Reclaim/* -DestinationPath "Reclaim-${{ steps.tag.outputs.name }}-windows.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: Reclaim-${{ steps.tag.outputs.name }}-windows.zip
          generate_release_notes: true
          body: |
            ## Reclaim ${{ steps.tag.outputs.name }}

            **Download:** `Reclaim-${{ steps.tag.outputs.name }}-windows.zip` below.
            Unzip anywhere and run `Reclaim.exe`. No installation, no Python needed.

            > This build is not code-signed yet, so Windows SmartScreen may show
            > an "unknown publisher" warning on first launch. Click **More info →
            > Run anyway**. The full source is in this repo and the binary is built
            > by GitHub Actions from that source — see the build log for this tag.

            If this tool saved you some disk space, tips are welcome via the
            **Sponsor** button. ☕
