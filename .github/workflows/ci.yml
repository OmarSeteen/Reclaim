name: CI

# Run the full test suite on every push and pull request.
# Tests are headless (no network, no secrets); the GUI smoke test runs Qt
# offscreen via QT_QPA_PLATFORM. We test on Windows because the tool targets
# Windows (winapi / locations resolve real Windows paths).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (black)
        run: python -m black --check .

      - name: Compile-check every module
        # compileall recurses the package (covers Reclaim/ui/ too) and needs no
        # shell glob expansion, which the Windows runner's PowerShell doesn't do.
        run: python -m compileall Reclaim

      - name: Layering check (package import loads no GUI toolkit)
        run: python -c "import sys, Reclaim; assert not ({'PySide6','tkinter'} & set(sys.modules)), 'GUI toolkit leaked into package import'"

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
